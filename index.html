<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Trace - 中1基礎計算</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Firebase references
    window.firebaseApp = null;
    window.db = null;
    window.auth = null;
    window.currentUserUid = null;

    try {
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'math-trace-app';
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "demo-key",
        projectId: "demo-project"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.firebaseApp = app;
      window.db = db;
      window.auth = auth;

      const initAuth = async () => {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
          if (auth.currentUser) {
            window.currentUserUid = auth.currentUser.uid;
            if (typeof window.onFirebaseReady === 'function') {
              window.onFirebaseReady();
            }
          }
        } catch (e) {
          console.error("Auth init error:", e);
        }
      };
      initAuth();
    } catch (e) {
      console.warn("Firebase initialization skipped or failed:", e);
    }
  </script>
  <style>
    /* 分数の縦積み表示用CSS */
    .fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      margin: 0 4px;
    }
    .fraction > span:first-child {
      border-bottom: 1.5px solid currentColor;
      padding: 0 4px;
      line-height: 1.1;
    }
    .fraction > span:last-child {
      padding: 0 4px;
      line-height: 1.1;
    }
    
    /* 印刷用スタイル（A4プリント作成用） */
    @media print {
      body { background: white; color: black; font-size: 11pt; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .page-break { page-break-before: always; }
      .print-single {
        display: block;
        max-width: 100%;
      }
      .problem-item { break-inside: avoid; margin-bottom: 1.5rem; }
      .answer-item { break-inside: avoid; margin-bottom: 0.75rem; }
      h1, h2 { text-align: center; }
      .print-preview-back { display: none !important; }
    }
    .print-only { display: none; }
    
    /* プレビューモード用のCSS追加 */
    .preview-mode .print-only { display: block; }
    .preview-mode .max-w-4xl { display: none; }

    /* 入力エリアのアニメーション */
    .fade-enter { opacity: 0; transform: translateY(-10px); }
    .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header -->

        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-md shadow-indigo-200">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">

      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">

        <div class="flex justify-between items-end border-b-2 border-slate-800 pb-2 text-sm font-bold text-slate-700">

      <div id="print-answers" class="space-y-3 text-base text-emerald-700 font-bold"></div>

  <!-- ================= JavaScript ロジック ================= -->
  <script>
    // --- メニュー定義 ---
    const stepDefinitions = {
      1: [
        "1. かっこ無しの加減", "2. かっこ有りの加減", "3. 乗除", 
        "4. 累乗", "5. 四則混合（かっこ無し）", "6. 四則混合（かっこ・累乗）", "7. 素因数分解"
      ],
      2: [
        "1. 文字式の表し方", "2. 1次式の加減", "3. 1次式と数の乗除", 
        "4. 分数式の計算（通分）", "5. 等式・不等式の立式（文章題）"
      ],
      3: [
        "1. 移項の基本", "2. 両辺に文字がある式", "3. かっこを含む式", 
        "4. 小数・分数を含む式", "5. 比例式", "6. 一次方程式の文章題"
      ]
    };

    const units = [
      { id: 1, name: "単元1：正負の数" },
      { id: 2, name: "単元2：文字式" },
      { id: 3, name: "単元3：一次方程式" }
    ];
    
    let currentUnit = 1;
    let currentStep = 1;
    let currentProblem = null;
    let currentInputMode = 'normal';
    let lastProblemText = ""; // 連続同一問題防止用

    // 成績データ管理
    let studentStats = JSON.parse(localStorage.getItem('math_trace_stats') || '{}');

    function renderUI() {
      const tabs = document.getElementById('unit-tabs');
      tabs.innerHTML = units.map(u => `
        <button onclick="setUnit(${u.id})" class="whitespace-nowrap px-5 py-2.5 rounded-2xl font-bold text-xs sm:text-sm transition-all ${currentUnit === u.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
          ${u.name}
        </button>
      `).join('');

      const pills = document.getElementById('step-pills');
      pills.innerHTML = stepDefinitions[currentUnit].map((stepName, idx) => `
        <button onclick="setStep(${idx + 1})" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${currentStep === idx + 1 ? 'bg-indigo-50 text-indigo-700 border-2 border-indigo-500 font-bold shadow-sm' : 'bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100'}">
          ${stepName}
        </button>
      `).join('');

      // 単元1のときだけ「整数・分数・小数」のチェックボックスを表示
      const numTypeContainer = document.getElementById('number-type-container');
      if (currentUnit === 1) {
        numTypeContainer.style.display = 'block';
      } else {
        numTypeContainer.style.display = 'none';
      }
    }

    function setUnit(uId) {
      currentUnit = uId;
      currentStep = 1;
      renderUI();
      startProblem();
    }

    function setStep(sId) {
      currentStep = sId;
      renderUI();
      startProblem();
    }

    function handleNumberTypeChange() {
      const intChk = document.getElementById('type-int').checked;
      const fracChk = document.getElementById('type-frac').checked;
      const decChk = document.getElementById('type-dec').checked;
      if (!intChk && !fracChk && !decChk) {
        document.getElementById('type-int').checked = true; // 最低1つは維持
      }
      startProblem();
    }

    // 入力モードの切り替えUI生成
    function setInputMode(mode) {
      currentInputMode = mode;
      const tabN = document.getElementById('tab-normal');
      const tabF = document.getElementById('tab-fraction');
      
      if (mode === 'normal') {
        tabN.className = "px-4 py-1.5 rounded-full text-xs font-bold border-2 border-indigo-600 bg-indigo-600 text-white transition-all";
        tabF.className = "px-4 py-1.5 rounded-full text-xs font-bold border-2 border-slate-200 bg-white text-slate-500 hover:border-indigo-400 transition-all";
        
        document.getElementById('input-area').innerHTML = `
          <input type="text" id="user-input-normal" autocomplete="off" class="w-full max-w-sm text-center text-3xl sm:text-4xl font-bold border-b-4 border-slate-300 focus:border-indigo-600 outline-none bg-transparent pb-2 transition-colors placeholder-slate-300 text-indigo-900 fade-enter-active" placeholder="答えを入力">
          <div class="flex gap-4 mt-3">
            <button onclick="insertChar('^2')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 text-xs font-bold shadow-sm">x² (累乗)</button>
            <button onclick="insertChar('^3')" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 text-xs font-bold shadow-sm">x³ (累乗)</button>
          </div>
        `;
        setupEnterKey('user-input-normal');
        document.getElementById('user-input-normal').focus();
      } else {
        tabF.className = "px-4 py-1.5 rounded-full text-xs font-bold border-2 border-indigo-600 bg-indigo-600 text-white transition-all";
        tabN.className = "px-4 py-1.5 rounded-full text-xs font-bold border-2 border-slate-200 bg-white text-slate-500 hover:border-indigo-400 transition-all";
        
        document.getElementById('input-area').innerHTML = `
          <div class="flex items-center gap-3 fade-enter-active">
            <input type="text" id="user-input-sign" class="w-14 text-center text-3xl font-bold border-b-4 border-slate-300 focus:border-indigo-600 outline-none bg-transparent pb-1" placeholder="-">
            <div class="flex flex-col items-center gap-1.5">
              <input type="text" id="user-input-num" class="w-24 text-center text-xl font-bold border-b-2 border-slate-400 focus:border-indigo-600 outline-none bg-transparent pb-1" placeholder="分子">
              <div class="w-full h-0.5 bg-slate-700"></div>
              <input type="text" id="user-input-den" class="w-24 text-center text-xl font-bold border-b-2 border-transparent focus:border-indigo-600 outline-none bg-transparent pt-1" placeholder="分母">
            </div>
          </div>
          <p class="text-xs text-slate-400 mt-2">※マイナスは左の枠へ</p>
        `;
        setupEnterKey('user-input-sign');
        setupEnterKey('user-input-num');
        setupEnterKey('user-input-den');
        document.getElementById('user-input-num').focus();
      }
    }

    window.insertChar = function(char) {
      const input = document.getElementById('user-input-normal');
      if(input) {
        input.value += char;
        input.focus();
      }
    }

    function setupEnterKey(id) {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener("keypress", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            if (!document.getElementById("check-btn").classList.contains("hidden")) {
              checkAnswer();
            } else if (!document.getElementById("next-btn").classList.contains("hidden")) {
              startProblem();
            }
          }
        });
      }
    }

    // --- ユーティリティ関数 ---
    function randInt(min, max, excludeZero = true) {
      let n;
      do { n = Math.floor(Math.random() * (max - min + 1)) + min; } while (excludeZero && n === 0);
      return n;
    }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while(b){let t=b; b=a%b; a=t;} return a; }
    function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

    function makeFracHTML(numHTML, denHTML) {
      return `<span class="fraction"><span style="border-bottom:1.5px solid currentColor;padding:0 4px;">${numHTML}</span><span style="padding:0 4px;">${denHTML}</span></span>`;
    }
    function formatLinear(a, b, variable = "x") {
      if (a === 0 && b === 0) return "0";
      let res = "";
      if (a !== 0) {
        if (a === 1) res += variable; else if (a === -1) res += `-${variable}`; else res += `${a}${variable}`;
      }
      if (b !== 0) {
        if (res === "") res += `${b}`; else res += b > 0 ? ` + ${b}` : ` - ${Math.abs(b)}`;
      }
      return res;
    }

    // 単元1用の柔軟な数値オブジェクト生成（整数・分数・小数に対応）
    function createTerm(intAllowed, fracAllowed, decAllowed) {
      const types = [];
      if (intAllowed) types.push('int');
      if (fracAllowed) types.push('frac');
      if (decAllowed) types.push('dec');
      const t = pick(types);

      if (t === 'int') {
        const val = randInt(-9, 9);
        return { type: 'int', val: val, num: val, den: 1, html: `${val < 0 ? `(${val})` : val}`, raw: `${val}`, isNeg: val < 0 };
      } else if (t === 'frac') {
        const den = pick([2, 3, 4, 5]);
        let num;
        do { num = randInt(-8, 8); } while (num === 0 || gcd(Math.abs(num), den) !== 1);
        const fracStr = makeFracHTML(Math.abs(num), den);
        const html = num < 0 ? `(-${fracStr})` : fracStr;
        const raw = `${num}/${den}`;
        return { type: 'frac', val: num / den, num: num, den: den, html: html, raw: raw, isFrac: true, isNeg: num < 0 };
      } else {
        const decVal = randInt(-9, 9) * 0.5; // -4.5 ~ 4.5
        if (decVal === 0) return createTerm(true, fracAllowed, false);
        // 小数を正確な有理数(num/den)に変換 (0.5刻みなので分母は2)
        const num = Math.round(decVal * 2);
        const den = 2;
        const html = decVal < 0 ? `(${decVal})` : `${decVal}`;
        return { type: 'dec', val: decVal, num: num, den: den, html: html, raw: `${decVal}`, isNeg: decVal < 0 };
      }
    }

    // 分数・小数の演算を正確に行い、HTMLとRaw文字列を返すヘルパー
    function calculateTermResult(t1, t2, op) {
      // どちらかに分数が含まれる場合、または割り算で割り切れない場合は分数として解く
      const hasFrac = (t1.type === 'frac' || t2.type === 'frac');
      
      let resNum, resDen;
      if (op === '+') {
        resNum = t1.num * t2.den + t2.num * t1.den;
        resDen = t1.den * t2.den;
      } else if (op === '-') {
        resNum = t1.num * t2.den - t2.num * t1.den;
        resDen = t1.den * t2.den;
      } else if (op === '*') {
        resNum = t1.num * t2.num;
        resDen = t1.den * t2.den;
      } else if (op === '/') {
        if (t2.num === 0) { t2.num = 1; }
        resNum = t1.num * t2.den;
        resDen = t1.den * t2.num;
      }

      // 負の符号を分子に寄せる
      if (resDen < 0) {
        resNum = -resNum;
        resDen = -resDen;
      }

      // 約分
      const g = gcd(resNum, resDen);
      resNum = resNum / g;
      resDen = resDen / g;

      // 整数になる場合
      if (resDen === 1) {
        return { html: `${resNum}`, raw: `${resNum}` };
      }

      // 分数が絡んでいる場合は必ず分数で表示
      if (hasFrac) {
        const sign = resNum < 0 ? "-" : "";
        const absNum = Math.abs(resNum);
        return {
          html: `${sign}${makeFracHTML(absNum, resDen)}`,
          raw: `${resNum}/${resDen}`
        };
      }

      // 両方とも小数、または整数と小数の場合
      // 10進数で割り切れる分母 (2, 4, 5, 10 等) なら綺麗な小数にする
      if (resDen === 2 || resDen === 4 || resDen === 5 || resDen === 10) {
        const floatVal = Math.round((resNum / resDen) * 1000) / 1000;
        return { html: `${floatVal}`, raw: `${floatVal}` };
      }

      // それ以外（1/3など循環小数になる場合）は分数で表示
      const sign = resNum < 0 ? "-" : "";
      return {
        html: `${sign}${makeFracHTML(Math.abs(resNum), resDen)}`,
        raw: `${resNum}/${resDen}`
      };
    }

    // --- 【単元1：正負の数】 ---
    function generateUnit1(step) {
      const intChk = document.getElementById('type-int').checked;
      const fracChk = document.getElementById('type-frac').checked;
      const decChk = document.getElementById('type-dec').checked;

      // ヘルパー：すでにカッコがある場合は二重にしない
      const wrapParen = (term) => {
        if (!term.isNeg) return term.html;
        return term.html.startsWith("(") ? term.html : `(${term.html})`;
      };

      let q, a, h = "", raw = "";
      if (step === 1) { // かっこ無し
        const t1 = createTerm(intChk, fracChk, decChk);
        const t2 = createTerm(intChk, fracChk, decChk);
        const isAdd = Math.random() < 0.5;
        const firstStr = t1.html.replace(/^\((.+)\)$/, '$1');
        const secondStr = wrapParen(t2);
        q = `${firstStr} ${isAdd ? '+' : '-'} ${secondStr}`;
        const res = calculateTermResult(t1, t2, isAdd ? '+' : '-');
        a = res.html; raw = res.raw;
      } else if (step === 2) { // かっこ有り
        const t1 = createTerm(intChk, fracChk, decChk);
        const t2 = createTerm(intChk, fracChk, decChk);
        const isSub = Math.random() < 0.5;
        q = `${wrapParen(t1)} ${isSub ? '-' : '+'} ${wrapParen(t2)}`;
        const res = calculateTermResult(t1, t2, isSub ? '-' : '+');
        a = res.html; raw = res.raw;
      } else if (step === 3) { // 乗除
        const t1 = createTerm(intChk, fracChk, decChk);
        const t2 = createTerm(intChk, fracChk, decChk);
        if (Math.random() < 0.5) {
          q = `${wrapParen(t1)} × ${wrapParen(t2)}`;
          const res = calculateTermResult(t1, t2, '*');
          a = res.html; raw = res.raw;
        } else {
          if (t2.num === 0) { t2.num = 2; t2.den = 1; t2.html = "2"; t2.val = 2; t2.isNeg = false; }
          q = `${wrapParen(t1)} ÷ ${wrapParen(t2)}`;
          const res = calculateTermResult(t1, t2, '/');
          a = res.html; raw = res.raw;
        }
      } else if (step === 4) { // 累乗
        const base = randInt(2, 5); const exp = randInt(2, 3); const isMinusOutside = Math.random() < 0.5;
        q = isMinusOutside ? `-${base}<sup>${exp}</sup>` : `(-${base})<sup>${exp}</sup>`;
        a = isMinusOutside ? `-${Math.pow(base, exp)}` : `${Math.pow(-base, exp)}`;
        raw = a;
        h = "かっこの外に指数があるか、中にあるかに注意しましょう。";
      } else if (step === 5 || step === 6) { // 混合
        const n1 = randInt(-5, 5); const n2 = randInt(-5, 5); const n3 = randInt(-5, 5);
        q = `${n1} + (${n2}) × (${n3})`; a = `${n1 + n2 * n3}`; raw = a;
        h = "かけ算・わり算を先に計算します。";
      } else if (step === 7) { // 素因数分解
        const primes = [2, 3, 5];
        const counts = [randInt(0,3,false), randInt(0,2,false), randInt(0,1,false)];
        if (counts[0]===0 && counts[1]===0 && counts[2]===0) counts[0] = 2;
        let val = 1; let ansStr = []; let rawArr = [];
        counts.forEach((c, i) => {
          if(c > 0) { 
            val *= Math.pow(primes[i], c); 
            ansStr.push(c === 1 ? `${primes[i]}` : `${primes[i]}<sup>${c}</sup>`); 
            rawArr.push(c === 1 ? `${primes[i]}` : `${primes[i]}^${c}`); 
          }
        });
        q = `${val} を素因数分解しなさい。`; a = ansStr.join(" × "); raw = rawArr.join("*");
      }
      return { questionHTML: q, answerHTML: a, answerRaw: raw, hint: h };
    }

    // --- 【単元2：文字式】 ---
    function generateUnit2(step) {
      if (step === 1) {
        const coeff = pick([-1, 1, randInt(-5,5)]);
        return { questionHTML: `y × (${coeff}) × x`, answerHTML: coeff === 1 ? "xy" : coeff === -1 ? "-xy" : `${coeff}xy` };
      } else if (step === 2) {
        const a=randInt(-5,5); const b=randInt(-5,5); const c=randInt(-5,5); const d=randInt(-5,5);
        return { questionHTML: `(${formatLinear(a,b)}) - (${formatLinear(c,d)})`, answerHTML: formatLinear(a-c, b-d) };
      } else if (step === 3) {
        const k=randInt(-5,5); const a=randInt(-5,5); const b=randInt(-5,5);
        return { questionHTML: `${k}(${formatLinear(a,b)})`, answerHTML: formatLinear(k*a, k*b) };
      } else if (step === 4) {
        const m=randInt(2,4); let n; do { n = randInt(2,5); } while(n === m);
        const a=randInt(-3,3); const b=randInt(-3,3); const c=randInt(-3,3); const d=randInt(-3,3);
        const L = lcm(m, n); const m1=L/m; const m2=L/n;
        const topX = a*m1 + c*m2; const topC = b*m1 + d*m2;
        const g = gcd(gcd(topX, topC), L);
        let ansNum = formatLinear(topX/g, topC/g); let den = L/g;
        return { 
          questionHTML: `${makeFracHTML(formatLinear(a,b), m)} + ${makeFracHTML(formatLinear(c,d), n)}`, 
          answerHTML: den===1 ? ansNum : makeFracHTML(ansNum, den),
          answerRaw: den===1 ? ansNum : `(${ansNum})/${den}`
        };
      } else if (step === 5) {
        const patterns = [
          () => { const n1=randInt(2,5); const pay=1000; return { q: `1本 a 円の鉛筆 ${n1}本を買い、${pay}円出したときのおつりは y 円だった。`, a: `${pay} - ${n1}a = y` }; },
          () => { const v=pick([40,50,60]); return { q: `x mの道のりを分速 ${v} mで進んだら y 分かかった。`, a: makeFracHTML("x", v) + " = y", raw: `x/${v}=y` }; },
          () => { const c=randInt(3,6); const p=500; return { q: `${p}円持って行き、1個 x 円のパンを${c}個買おうとしたが足りなかった。`, a: `${c}x > ${p}` }; },
          () => { const r=20; return { q: `定価 x 円の品を ${r}％引きで買った代金は y 円だった。`, a: `0.8x = y` }; }
        ];
        const p = pick(patterns)();
        return { questionHTML: p.q + " (等式・不等式で表せ)", answerHTML: p.a, answerRaw: p.raw || p.a, hint: "文章通りに式を組み立てます。" };
      }
    }

    // --- 【単元3：一次方程式】 ---
    function generateUnit3(step) {
      const ansX = randInt(-6, 6);
      if (step === 1) {
        const a = randInt(-8,8); return { questionHTML: formatLinear(1, a) + ` = ${ansX + a}`, answerHTML: `x = ${ansX}`, answerRaw: `${ansX}` };
      } else if (step === 2) {
        const a=randInt(-5,5); let c; do { c = randInt(-5,5); } while(c === a); const b=randInt(-5,5);
        return { questionHTML: `${formatLinear(a,b)} = ${formatLinear(c, a*ansX+b-c*ansX)}`, answerHTML: `x = ${ansX}`, answerRaw: `${ansX}` };
      } else if (step === 3) {
        const k=randInt(-4,4); const a=randInt(-5,5); let c; do { c = randInt(-4,4); } while(c === k);
        return { questionHTML: `${k}(${formatLinear(1,a)}) = ${formatLinear(c, k*(ansX+a)-c*ansX)}`, answerHTML: `x = ${ansX}`, answerRaw: `${ansX}` };
      } else if (step === 4) {
        const m=2; const n=3; const k1=randInt(-3,3); const k2=k1; 
        const a = k1*m - ansX; const b = k2*n - 2*ansX;
        return { questionHTML: `${makeFracHTML(formatLinear(1,a),m)} = ${makeFracHTML(formatLinear(2,b),n)}`, answerHTML: `x = ${ansX}`, answerRaw: `${ansX}` };
      } else if (step === 5) {
        const ans = randInt(1, 4) * 3;
        return { questionHTML: `3 : 2 = x : ${ans*2/3}`, answerHTML: `x = ${ans}`, answerRaw: `${ans}` };
      } else if (step === 6) {
        const patterns = [
          () => { const x=randInt(3,7); const total=10; const aP=120; const oP=80; return { q: `1個${aP}円のりんごと1個${oP}円のみかんを合わせて${total}個買い、代金は${aP*x + oP*(total-x)}円でした。りんごは何個？`, a: `${x} 個`, raw: `${x}` }; },
          () => { const x=randInt(10,20); const p1=3; const p2=4; const extra=5; return { q: `アメを1人に${p1}個配ると${extra}個余り、${p2}個配ると不足した。人数は？`, a: `${x} 人`, raw: `${x}` }; },
          () => { const ans=10; const v1=60; const v2=90; const d=5; return { q: `弟が分速${v1}mで出発し、その${d}分後に兄が分速${v2}mで追いかけた。兄は何分後に追いつく？`, a: `${ans} 分後`, raw: `${ans}` }; }
        ];
        const p = pick(patterns)();
        return { questionHTML: p.q, answerHTML: p.a, answerRaw: p.raw, hint: "求めるものを x として方程式を立てます。" };
      }
    }

    function getProblem() {
      let p;
      let loopCount = 0;
      do {
        if (currentUnit === 1) p = generateUnit1(currentStep);
        else if (currentUnit === 2) p = generateUnit2(currentStep);
        else p = generateUnit3(currentStep);
        loopCount++;
      } while (p.questionHTML === lastProblemText && loopCount < 5);
      lastProblemText = p.questionHTML;

      // フォントサイズ調整（文章題等の長い問題はスッキリ表示）
      const qDisp = document.getElementById("question-display");
      if (p.questionHTML.length > 30) {
        qDisp.className = "text-base sm:text-xl font-medium mt-4 mb-8 leading-relaxed py-2 min-h-[80px] flex items-center justify-center overflow-x-auto text-slate-900";
      } else {
        qDisp.className = "text-3xl sm:text-4xl font-medium mt-4 mb-8 leading-relaxed py-2 min-h-[80px] flex items-center justify-center overflow-x-auto text-slate-900";
      }

      return p;
    }

    function startProblem() {
      currentProblem = getProblem();
      document.getElementById("question-display").innerHTML = currentProblem.questionHTML;
      setInputMode(currentInputMode);

      document.getElementById("feedback-display").classList.add("hidden");
      document.getElementById("hint-text").classList.add("hidden");
      
      document.getElementById("check-btn").classList.remove("hidden");
      document.getElementById("next-btn").classList.add("hidden");
    }

    function normalizeInput(str) {
      if(!str) return "";
      return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
          return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      }).replace(/\s+/g, "").toLowerCase();
    }

    function checkAnswer() {
      const nameInput = document.getElementById('student-name').value.trim();
      if (!nameInput) {
        document.getElementById('modal-name-input').value = "";
        document.getElementById('name-modal').classList.remove('hidden');
        setTimeout(() => document.getElementById('modal-name-input').focus(), 100);
        return;
      }

      let userVal = "";
      if (currentInputMode === 'normal') {
        const inputEl = document.getElementById("user-input-normal");
        userVal = normalizeInput(inputEl.value);
        inputEl.disabled = true;
      } else {
        const signEl = document.getElementById("user-input-sign");
        const numEl = document.getElementById("user-input-num");
        const denEl = document.getElementById("user-input-den");
        
        const sign = normalizeInput(signEl.value);
        const num = normalizeInput(numEl.value);
        const den = normalizeInput(denEl.value);
        
        if (num && den) {
          userVal = `${sign}(${num})/${den}`;
        } else if (sign) {
          userVal = sign;
        }
        signEl.disabled = true;
        numEl.disabled = true;
        denEl.disabled = true;
      }

      let ansVal = "";
      if (currentProblem.answerRaw) {
        ansVal = String(currentProblem.answerRaw).replace(/\s+/g, "").toLowerCase();
      } else {
        ansVal = String(currentProblem.answerHTML).replace(/<[^>]*>?/gm, '').replace(/\s+/g, "").toLowerCase();
      }

      const ansNumMatch = ansVal.match(/^-?\d+/);
      const ansNumOnly = ansNumMatch ? ansNumMatch[0] : null;

      let isCorrect = false;
      if (userVal === ansVal) isCorrect = true;
      if (!isCorrect && userVal === ansVal.replace(/^x=/, '')) isCorrect = true;
      if (!isCorrect && ansNumOnly && userVal === ansNumOnly) isCorrect = true;
      if (!isCorrect && currentInputMode === 'fraction') {
         if (userVal.replace(/[()]/g, "") === ansVal.replace(/[()]/g, "")) isCorrect = true;
      }

      // 成績の記録と自動送信
      recordStats(currentUnit, currentStep, isCorrect);
      autoSubmitScore();

      const feedbackEl = document.getElementById("feedback-display");
      const hintEl = document.getElementById("hint-text");

      feedbackEl.classList.remove("hidden");

      if (isCorrect) {
        feedbackEl.innerHTML = "⭕ 大正解！";
        feedbackEl.className = "mb-6 text-xl sm:text-2xl font-bold py-4 px-6 rounded-2xl bg-emerald-50 text-emerald-700 border border-emerald-200";
      } else {
        feedbackEl.innerHTML = `❌ 残念...<br><span class="text-base sm:text-lg mt-3 inline-block">正解は：<span class="font-black text-rose-600 mx-2 text-2xl">${currentProblem.answerHTML}</span></span>`;
        feedbackEl.className = "mb-6 text-xl sm:text-2xl font-bold py-4 px-6 rounded-2xl bg-rose-50 text-rose-700 border border-rose-200";
        if (currentProblem.hint) {
          hintEl.innerHTML = `💡 <span class="font-bold">アドバイス：</span><br>${currentProblem.hint}`;
          hintEl.classList.remove("hidden");
        }
      }

      document.getElementById("check-btn").classList.add("hidden");
      document.getElementById("next-btn").classList.remove("hidden");
      setTimeout(() => document.getElementById("next-btn").focus(), 100);
    }

    function recordStats(uId, sId, isCorrect) {
      const key = `u${uId}_s${sId}`;
      if (!studentStats[key]) {
        studentStats[key] = { total: 0, correct: 0 };
      }
      studentStats[key].total += 1;
      if (isCorrect) studentStats[key].correct += 1;
      localStorage.setItem('math_trace_stats', JSON.stringify(studentStats));
    }

    // --- Firebase自動同期 ---
    async function autoSubmitScore() {
      const name = document.getElementById('student-name').value.trim();
      if (!name || !window.db || !window.currentUserUid) return;

      let totalCount = 0;
      let correctCount = 0;
      Object.values(studentStats).forEach(st => {
        totalCount += st.total;
        correctCount += st.correct;
      });
      const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;

      try {
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'math-trace-app';
        const docRef = window.FirebaseFirestore.doc(window.db, 'artifacts', appId, 'public', 'data', 'scores', window.currentUserUid);
        await window.FirebaseFirestore.setDoc(docRef, {
          name: name,
          total: totalCount,
          correct: correctCount,
          accuracy: accuracy,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      } catch (e) {
        console.error("Auto submit error:", e);
      }
    }

    async function openScoreList() {
      document.getElementById('score-list-modal').classList.remove('hidden');
      const container = document.getElementById('score-list-content');
      container.innerHTML = `<p class="text-center text-slate-400 py-6">読み込み中...</p>`;

      if (!window.db) {
        container.innerHTML = `<p class="text-center text-rose-500 py-6">クラウドデータベースが接続されていません。</p>`;
        return;
      }

      try {
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'math-trace-app';
        const q = window.FirebaseFirestore.collection(window.db, 'artifacts', appId, 'public', 'data', 'scores');
        const snapshot = await window.FirebaseFirestore.getDocs(q);
        
        if (snapshot.empty) {
          container.innerHTML = `<p class="text-center text-slate-400 py-6">まだ誰も成績を送信していません。</p>`;
          return;
        }

        let html = `
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b-2 border-slate-200 text-slate-500 text-xs uppercase">
                <th class="py-3 px-4">生徒名</th>
                <th class="py-3 px-4 text-center">挑戦数</th>
                <th class="py-3 px-4 text-center">正解数</th>
                <th class="py-3 px-4 text-center">正答率</th>
                <th class="py-3 px-4 text-right">最終更新</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm">
        `;

        snapshot.forEach(doc => {
          const d = doc.data();
          const dateStr = d.updatedAt ? new Date(d.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '-';
          html += `
            <tr class="hover:bg-slate-50">
              <td class="py-3 px-4 font-bold text-slate-800">${d.name || '名無し'}</td>
              <td class="py-3 px-4 text-center text-slate-600">${d.total || 0}問</td>
              <td class="py-3 px-4 text-center text-emerald-600 font-bold">${d.correct || 0}問</td>
              <td class="py-3 px-4 text-center font-black ${d.accuracy >= 80 ? 'text-emerald-600' : d.accuracy >= 50 ? 'text-amber-600' : 'text-rose-600'}">${d.accuracy || 0}%</td>
              <td class="py-3 px-4 text-right text-xs text-slate-400">${dateStr}</td>
            </tr>
          `;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
      } catch (e) {
        console.error(e);
        container.innerHTML = `<p class="text-center text-rose-500 py-6">データの取得に失敗しました。</p>`;
      }
    }

    function closeScoreList() {
      document.getElementById('score-list-modal').classList.add('hidden');
    }

    function submitModalName() {
      const modalVal = document.getElementById('modal-name-input').value.trim();
      if (!modalVal) {
        document.getElementById('modal-name-input').classList.add('border-rose-500', 'bg-rose-50');
        return;
      }
      document.getElementById('student-name').value = modalVal;
      document.getElementById('name-modal').classList.add('hidden');
      
      autoSubmitScore();
      checkAnswer();
    }

    function showAnalysis() {
      document.getElementById('analysis-modal').classList.remove('hidden');
      const content = document.getElementById('analysis-content');
      
      let totalQ = 0;
      let totalC = 0;
      let detailsHTML = "";

      units.forEach(u => {
        let uQ = 0, uC = 0;
        stepDefinitions[u.id].forEach((stepName, sIdx) => {
          const key = `u${u.id}_s${sIdx + 1}`;
          const st = studentStats[key] || { total: 0, correct: 0 };
          uQ += st.total;
          uC += st.correct;
          totalQ += st.total;
          totalC += st.correct;

          const acc = st.total > 0 ? Math.round((st.correct / st.total) * 100) : 0;
          detailsHTML += `
            <div class="flex items-center justify-between py-2 border-b border-slate-100 text-sm">
              <span class="text-slate-600 font-medium">${u.name.split('：')[1]} / ${stepName}</span>
              <div class="flex items-center gap-4">
                <span class="text-xs text-slate-400">${st.correct}/${st.total}問正解</span>
                <span class="font-bold w-12 text-right ${acc >= 80 ? 'text-emerald-600' : acc >= 50 ? 'text-amber-600' : 'text-slate-400'}">${acc}%</span>
              </div>
            </div>
          `;
        });
      });

      const totalAcc = totalQ > 0 ? Math.round((totalC / totalQ) * 100) : 0;

      content.innerHTML = `
        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 text-center">
          <p class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1">トータル正答率</p>
          <div class="text-4xl sm:text-5xl font-black text-indigo-600 mb-2">${totalAcc}%</div>
          <p class="text-xs text-slate-600">累計解答数：<span class="font-bold">${totalQ}</span>問中 <span class="font-bold text-emerald-600">${totalC}</span>問正解</p>
        </div>
        <div>
          <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">単元・ステップ別成績詳細</h4>
          <div class="bg-slate-50 rounded-2xl p-4 border border-slate-100 max-h-60 overflow-y-auto">
            ${detailsHTML}
          </div>
        </div>
      `;
    }

    function closeAnalysis() {
      document.getElementById('analysis-modal').classList.add('hidden');
    }

    window.onload = () => {
      // Firebase Firestore命名空間の退避
      if (typeof window.db !== 'undefined' && window.db) {
        window.FirebaseFirestore = {
          doc: window.doc || (() => {}),
          setDoc: window.setDoc || (() => {}),
          collection: window.collection || (() => {}),
          getDocs: window.getDocs || (() => {})
        };
      }
      renderUI();
      startProblem();
    };

    // --- 印刷イベント ---
    function generatePrint(count) {
      const uText = units.find(u => u.id === currentUnit).name;
      const sText = stepDefinitions[currentUnit][currentStep - 1];
      
      document.getElementById("print-title").textContent = `数学 確認テスト（${uText}）`;
      document.getElementById("print-subtitle").textContent = `【ステップ】 ${sText}`;
      document.getElementById("print-title-ans").textContent = `数学 確認テスト【解答】（${uText}）`;
      document.getElementById("print-subtitle-ans").textContent = `【ステップ】 ${sText}`;
      
      const qContainer = document.getElementById("print-problems");
      const aContainer = document.getElementById("print-answers");
      qContainer.innerHTML = "";
      aContainer.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        const p = getProblem();
        
        const qDiv = document.createElement("div");
        qDiv.className = "problem-item flex items-start text-base sm:text-lg";
        qDiv.innerHTML = `<span class="font-bold mr-3 inline-block w-8 text-right">(${i})</span><div class="flex-1">${p.questionHTML}</div>`;
        qContainer.appendChild(qDiv);

        const aDiv = document.createElement("div");
        aDiv.className = "answer-item flex items-center text-base sm:text-lg";
        aDiv.innerHTML = `<span class="font-bold mr-3 inline-block w-8 text-right text-slate-900">(${i})</span><div class="flex-1">${p.answerHTML}</div>`;
        aContainer.appendChild(aDiv);
      }

      document.body.classList.add("preview-mode");
      window.scrollTo(0, 0);
    }

    function executePrint(mode) {
      const pSheet = document.getElementById("print-problem-sheet");
      const aSheet = document.getElementById("print-answer-sheet");
      
      if (mode === 'all') {
        pSheet.style.display = 'block';
        aSheet.style.display = 'block';
      } else if (mode === 'problems') {
        pSheet.style.display = 'block';
        aSheet.style.display = 'none';
      } else if (mode === 'answers') {
        pSheet.style.display = 'none';
        aSheet.style.display = 'block';
      }
      window.print();
    }

    function closePrintPreview() {
      document.body.classList.remove("preview-mode");
      document.getElementById("print-problem-sheet").style.display = 'block';
      document.getElementById("print-answer-sheet").style.display = 'block';
    }
  </script>
</body>
</html>
